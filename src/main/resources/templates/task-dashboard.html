<!--        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-2"></div>-->
            <div th:replace="~{fragments/PostLogin/tasks/tasks-table :: tasks-table-fragment}"></div>
            <div class="pagination-controls">
                <!-- Link to first page (disabled if already on the first page) -->
                <a th:if="${currentPage > 0}" th:href="@{/tasks(page=0, size=${tasksPage.size})}">&laquo; First</a>
                <span th:if="${currentPage == 0}" class="disabled">&laquo; First</span>

                <!-- Link to previous page (disabled if already on the first page) -->
                <a th:if="${currentPage > 0}" th:href="@{/tasks(page=${currentPage - 1}, size=${tasksPage.size})}">&lsaquo; Prev</a>
                <span th:if="${currentPage == 0}" class="disabled">&lsaquo; Prev</span>

                <!-- Display current page / total pages -->
                <span th:text="${currentPage + 1} + ' / ' + ${totalPages}"></span>

                <!-- Link to next page (disabled if on the last page) -->
                <a th:if="${currentPage + 1 < totalPages}" th:href="@{/tasks(page=${currentPage + 1}, size=${tasksPage.size})}">Next &rsaquo;</a>
                <span th:if="${currentPage + 1 == totalPages}" class="disabled">Next &rsaquo;</span>

                <!-- Link to last page (disabled if already on the last page) -->
                <a th:if="${currentPage + 1 < totalPages}" th:href="@{/tasks(page=${totalPages - 1}, size=${tasksPage.size})}">Last &raquo;</a>
                <span th:if="${currentPage + 1 == totalPages}" class="disabled">Last &raquo;</span>
            </div>
