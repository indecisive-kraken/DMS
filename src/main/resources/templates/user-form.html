<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="" />
    <title>Insert Task</title>
    <link th:href="@{/bootstrap-5.3.8/css/bootstrap.min.css}" rel="stylesheet" />
    <link th:href="@{/css/dashboard.css}" rel="stylesheet" />
    <link th:href="@{/css/common_style_for_dashboard_pages.css}" rel="stylesheet" />
</head>
<body>

<div th:insert="~{fragments/SVGSet :: SVGSet}"></div>
<div class="dropdown position-fixed bottom-0 end-0 mb-3 me-3 bd-mode-toggle">
    <button class="btn btn-bd-primary py-2 dropdown-toggle d-flex align-items-center"
            id="bd-theme"
            type="button"
            aria-expanded="false"
            data-bs-toggle="dropdown"
            aria-label="Toggle theme (auto)">
        <svg class="bi my-1 theme-icon-active" aria-hidden="true">
            <use href="#circle-half"></use>
        </svg>
        <span class="visually-hidden" id="bd-theme-text">Toggle theme</span>
    </button>
    <ul class="dropdown-menu dropdown-menu-end shadow"
        aria-labelledby="bd-theme-text">
        <li>
            <button type="button"
                    class="dropdown-item d-flex align-items-center"
                    data-bs-theme-value="light"
                    aria-pressed="false">
                <svg class="bi me-2 opacity-50" aria-hidden="true">
                    <use href="#sun-fill"></use>
                </svg>
                Light
                <svg class="bi ms-auto d-none" aria-hidden="true">
                    <use href="#check2"></use>
                </svg>
            </button>
        </li>
        <li>
            <button type="button"
                    class="dropdown-item d-flex align-items-center"
                    data-bs-theme-value="dark"
                    aria-pressed="false">
                <svg class="bi me-2 opacity-50" aria-hidden="true">
                    <use href="#moon-stars-fill"></use>
                </svg>
                Dark
                <svg class="bi ms-auto d-none" aria-hidden="true">
                    <use href="#check2"></use>
                </svg>
            </button>
        </li>
        <li>
            <button type="button"
                    class="dropdown-item d-flex align-items-center active"
                    data-bs-theme-value="auto"
                    aria-pressed="true">
                <svg class="bi me-2 opacity-50" aria-hidden="true">
                    <use href="#circle-half"></use>
                </svg>
                Auto
                <svg class="bi ms-auto d-none" aria-hidden="true">
                    <use href="#check2"></use>
                </svg>
            </button>
        </li>
    </ul>
</div>

<header class="py-3 border-bottom">
    <div
            class="container-fluid d-grid gap-3 align-items-center"
            style="grid-template-columns: 1fr 2fr"
    >
        <div class="dropdown">
            <a
                    href="#"
                    class="d-flex align-items-center col-lg-4 mb-2 mb-lg-0 link-body-emphasis text-decoration-none dropdown-toggle"
                    data-bs-toggle="dropdown"
                    aria-expanded="false"
                    aria-label="Bootstrap menu"
            >
                <svg class="bi me-2" width="40" height="32" aria-hidden="true">
                    <use xlink:href="#bootstrap"></use>
                </svg>
            </a>
            <ul class="dropdown-menu text-small shadow">
                <li>
                    <a class="dropdown-item active" href="#" aria-current="page"
                    >Overview</a
                    >
                </li>
                <li><a class="dropdown-item" href="#">Inventory</a></li>
                <li><a class="dropdown-item" href="#">Customers</a></li>
                <li><a class="dropdown-item" href="#">Products</a></li>
                <li><hr class="dropdown-divider" /></li>
                <li><a class="dropdown-item" href="#">Reports</a></li>
                <li><a class="dropdown-item" href="#">Analytics</a></li>
            </ul>
        </div>
        <div class="d-flex align-items-center">
            <form class="w-100 me-3" role="search">
                <input
                        type="search"
                        class="form-control"
                        placeholder="Search..."
                        aria-label="Search"
                />
            </form>
            <div class="flex-shrink-0 dropdown">
                <a
                        href="#"
                        class="d-block link-body-emphasis text-decoration-none dropdown-toggle"
                        data-bs-toggle="dropdown"
                        aria-expanded="false"
                >
                    <!--                    <img-->
                    <!--                            src="https://github.com/mdo.png"-->
                    <!--&lt;!&ndash;                            alt="mdo"&ndash;&gt;-->
                    <!--                            width="32"-->
                    <!--                            height="32"-->
                    <!--                            class="rounded-circle"-->
                    <!--                    />-->
                </a>
                <ul class="dropdown-menu text-small shadow">
                    <li><a class="dropdown-item" href="#">New project...</a></li>
                    <li><a class="dropdown-item" href="#">Settings</a></li>
                    <li><a class="dropdown-item" href="#">Profile</a></li>
                    <li><hr class="dropdown-divider" /></li>
                    <li><a class="dropdown-item" href="#">Sign out</a></li>
                </ul>
            </div>
        </div>
    </div>
</header>


<div class="container-fluid h-100">
    <div class="row h-100">
        <div class="sidebar border-right col-md-1 col-lg-2 p-0 bg-body-tertiary min-vh-100 d-none d-md-flex">
            <div class="offcanvas-md offcanvas-end bg-body-tertiary"
                 tabindex="-1"
                 id="sidebarMenu"
                 aria-labelledby="sidebarMenuLabel">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="sidebarMenuLabel">
                        Company name
                    </h5>
                    <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="offcanvas"
                            data-bs-target="#sidebarMenu"
                            aria-label="Close"
                    ></button>
                </div>
                <div class="offcanvas-body d-md-flex flex-column p-0 pt-lg-3 overflow-y-auto">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a
                                    class="nav-link d-flex align-items-center gap-2 active"
                                    aria-current="page"
                                    th:href="@{/tasks/dashboard}"
                            >
                                <svg class="bi" aria-hidden="true">
                                    <use xlink:href="#house-fill"></use>
                                </svg>
                                Ask AI!
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link d-flex align-items-center gap-2" th:href="@{/tasks/dashboard}">
                                <svg class="bi" aria-hidden="true">
                                    <use xlink:href="#file-earmark"></use>
                                </svg>
                                Tasks
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link d-flex align-items-center gap-2" th:href="@{/clients/dashboard}">
                                <svg class="bi" aria-hidden="true">
                                    <use xlink:href="#people"></use>
                                </svg>
                                Clients
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link d-flex align-items-center gap-2" th:href="@{/users/dashboard}">
                                <svg class="bi" aria-hidden="true">
                                    <use xlink:href="#puzzle"></use>
                                </svg>
                                Users
                            </a>
                        </li>
                    </ul>
                    <hr class="my-3" />
                    <h6 class="sidebar-heading d-flex justify-content-between align-items-center px-3 mt-3 mb-3 text-body-secondary">
                        <span>Additional settings</span>
                        <a class="link-secondary"
                           href="#"
                           aria-label="Add a new report">
                            <svg class="bi" aria-hidden="true">
                                <use xlink:href="#plus-circle"></use>
                            </svg>
                        </a>
                    </h6>
                    <ul class="nav flex-column mb-auto">
                        <li class="nav-item">
                            <a class="nav-link d-flex align-items-center gap-2" href="#">
                                <svg class="bi" aria-hidden="true">
                                    <use xlink:href="#gear-wide-connected"></use>
                                </svg>
                                Settings
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link d-flex align-items-center gap-2" th:href="@{/logout}">
                                <svg class="bi" aria-hidden="true">
                                    <use xlink:href="#door-closed"></use>
                                </svg>
                                Sign out
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-3 mb-2">
                <ul class="nav nav-tabs">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Active</a>
                    </li>
                    <li class="nav-item btn-sm ms-2">
                        <a class="nav-link" aria-current="page" href="#">+</a>
                    </li>
                </ul>
            </div>

            <div th:replace="~{fragments/PostLogin/users/users-form-fields :: users-fields-fragment}"></div>
        </main>
    </div>
</div>
</body>
</html>
