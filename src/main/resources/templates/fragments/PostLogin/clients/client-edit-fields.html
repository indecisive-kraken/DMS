<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="" />
    <title>Edit Client</title>
    <link th:href="@{/bootstrap-5.3.8/css/bootstrap.min.css}" rel="stylesheet" />
    <link th:href="@{/css/dashboard.css}" rel="stylesheet" />
    <link th:href="@{/css/common_style_for_dashboard_pages.css}" rel="stylesheet" />
</head>
<body>

<!-- Parent-level fragment -->
<div th:fragment="client-edit-fields-fragment">

        <div th:if="${errorMessage}" class="alert alert-danger">
            <p th:text="${errorMessage}"></p>
        </div>

        <form th:action="@{/clients/dashboard/edit}" th:object="${clientEditDTO}" method="POST">

            <!-- Hidden ID -->
            <input type="hidden" th:field="*{id}">

            <!-- Company Name -->
            <div class="mb-3">
                <label class="form-label">Company Name</label>
                <input type="text" class="form-control" th:field="*{companyName}">
            </div>

            <!-- Client Code (cid) -->
            <div class="mb-3">
                <label class="form-label">Client Code</label>
                <input type="text" class="form-control" th:field="*{cid}">
                <div class="text-danger"
                     th:if="${#fields.hasErrors('cid')}"
                     th:errors="*{cid}"></div>
            </div>

            <!-- Contact Person -->
            <div class="mb-3">
                <label class="form-label">Contact Person</label>
                <input type="text" class="form-control" th:field="*{contactPerson}">
            </div>

            <!-- VAT Number -->
            <div class="mb-3">
                <label class="form-label">VAT Number</label>
                <input type="text" class="form-control" th:field="*{vatNumber}">
            </div>

            <!-- Registration Number -->
            <div class="mb-3">
                <label class="form-label">Registration Number</label>
                <input type="text" class="form-control" th:field="*{registrationNumber}">
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" th:field="*{email}">
            </div>

            <!-- Phone -->
            <div class="mb-3">
                <label class="form-label">Phone</label>
                <input type="text" class="form-control" th:field="*{phone}">
            </div>

            <!-- Website -->
            <div class="mb-3">
                <label class="form-label">Website</label>
                <input type="text" class="form-control" th:field="*{website}">
            </div>

            <!-- Address Line 1 -->
            <div class="mb-3">
                <label class="form-label">Address Line 1</label>
                <input type="text" class="form-control" th:field="*{addressLine1}">
            </div>

            <!-- Address Line 2 -->
            <div class="mb-3">
                <label class="form-label">Address Line 2</label>
                <input type="text" class="form-control" th:field="*{addressLine2}">
            </div>

            <!-- City -->
            <div class="mb-3">
                <label class="form-label">City</label>
                <input type="text" class="form-control" th:field="*{city}">
            </div>

            <!-- State / Province -->
            <div class="mb-3">
                <label class="form-label">State / Province</label>
                <input type="text" class="form-control" th:field="*{stateProvince}">
            </div>

            <!-- Postal Code -->
            <div class="mb-3">
                <label class="form-label">Postal Code</label>
                <input type="text" class="form-control" th:field="*{postalCode}">
            </div>

            <!-- Country -->
            <div class="mb-3">
                <label class="form-label">Country</label>
                <input type="text" class="form-control" th:field="*{country}">
            </div>

            <!-- Country Region -->
            <div class="mb-3">
                <label class="form-label">Country Region</label>
                <input type="text" class="form-control" th:field="*{countryRegion}">
            </div>

            <!-- Industry -->
            <div class="mb-3">
                <label class="form-label">Industry</label>
                <input type="text" class="form-control" th:field="*{industry}">
            </div>

            <!-- Billing Currency -->
            <div class="mb-3">
                <label class="form-label">Billing Currency</label>
                <input type="text" class="form-control" th:field="*{billingCurrency}">
            </div>

            <button type="submit" class="btn btn-primary">Save</button>
            <a th:href="@{/clients/dashboard}" class="btn btn-secondary">Cancel</a>
        </form>
</div>
</body>
</html>
