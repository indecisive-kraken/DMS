<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity" lang="en" data-bs-theme="auto">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div th:insert="~{fragments/SVGSet :: SVGSet}"></div>
<div class="table-responsive small" th:fragment="client-table-fragment">
    <table class="table table-striped table-sm">
        <thead>
        <tr>
            <th scope="col">Company Name</th>
            <th scope="col">Contact Person</th>
            <th scope="col">VAT</th>
            <th scope="col">Registration Number</th>
            <th scope="col">e-mail</th>
            <th scope="col">Phone<th>
            <th scope="col">Website</th>
            <th scope="col">Address Line 1</th>
            <th scope="col">Address Line 2</th>
            <th scope="col">City</th>
            <th scope="col">State Province</th>
            <th scope="col">Postal Code</th>
            <th scope="col">Country<th>
            <th scope="col">Country Region</th>
            <th scope="col">Industry</th>
            <th scope="col">Billing Currency</th>
            <th scope="col">Edit<th>
        </tr>
        </thead>
        <tbody>
            <tr th:each="client : ${clientsPage.content}">
                <td th:text="${client.companyName}"></td>
                <td th:text="${client.contactPerson}"></td>
                <td th:text="${client.vatNumber}"></td>
                <td th:text="${client.registrationNumber}"></td>
                <td th:text="${client.email}"></td>
                <td th:text="${client.phone}"></td>
                <td th:text="${client.website}"></td>
                <td th:text="${client.addressLine1}"></td>
                <td th:text="${client.addressLine2}"></td>
                <td th:text="${client.city}"></td>
                <td th:text="${client.stateProvince}"></td>
                <td th:text="${client.postalCode}"></td>
                <td th:text="${client.country}"></td>
                <td th:text="${client.countryRegion}"></td>
                <td th:text="${client.industry}"></td>
                <td th:text="${client.billingCurrency}"></td>
                <td sec:authorize="hasAuthority('EDITS_CLIENTS')">
                    <a th:href="@{/clients/dashboard/edit/{cid}(cid=${client.cid})}"
                       class="btn btn-sm btn-outline-primary">Edit</a>
                    <a th:href="@{/clients/dashboard/delete/{cid}(cid=${client.cid})}"
                       class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this client?')">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
