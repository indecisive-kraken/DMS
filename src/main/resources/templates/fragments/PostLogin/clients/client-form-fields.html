<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity" lang="en" data-bs-theme="auto">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<div th:fragment="client-form-fields">
<main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Currently editing: {}</h1>
        <div class="btn-toolbar mb-2 mb-md-0">
            <div class="btn-group me-2">
                <button type="button" class="btn btn-sm btn-outline-secondary">
                    Share
                </button>
                <button type="button" class="btn btn-sm btn-outline-secondary">
                    Export
                </button>
            </div>
            <button type="button" class="btn btn-sm btn-outline-secondary dropdown-toggle d-flex align-items-center gap-1">
                <svg class="bi" aria-hidden="true">
                    <use xlink:href="#calendar3"></use>
                </svg>
                This week
            </button>
        </div>
    </div>
    <form method="POST" th:object="${clientInsertDTO}">

        <div class="row g-3">

            <!-- Company Name -->
            <div class="col-sm-6">
                <label for="companyName" class="form-label">Company Name</label>
                <input type="text"
                       class="form-control"
                       id="companyName"
                       th:field="*{companyName}"
                       required/>
                <div class="invalid-feedback"
                     th:errors="*{companyName}"></div>
            </div>

            <!-- Contact Person -->
            <div class="col-sm-6">
                <label for="contactPerson" class="form-label">Contact Person</label>
                <input type="text"
                       class="form-control"
                       id="contactPerson"
                       th:field="*{contactPerson}"
                       required/>
                <div class="invalid-feedback"
                     th:errors="*{contactPerson}"></div>
            </div>

            <!-- Email -->
            <div class="col-sm-6">
                <label for="email" class="form-label">E-mail</label>
                <input type="email"
                       class="form-control"
                       id="email"
                       th:field="*{email}"
                       required/>
                <div class="invalid-feedback"
                     th:errors="*{email}"></div>
            </div>

            <!-- VAT Number -->
            <div class="col-sm-6">
                <label for="vatNumber" class="form-label">VAT Number</label>
                <input type="text"
                       class="form-control"
                       id="vatNumber"
                       th:field="*{vatNumber}"/>
                <div class="invalid-feedback"
                     th:errors="*{vatNumber}"></div>
            </div>

            <!-- Registration Number -->
            <div class="col-sm-6">
                <label for="registrationNumber" class="form-label">Registration Number</label>
                <input type="text"
                       class="form-control"
                       id="registrationNumber"
                       th:field="*{registrationNumber}"/>
            </div>

            <!-- Phone -->
            <div class="col-sm-6">
                <label for="phone" class="form-label">Phone</label>
                <input type="text"
                       class="form-control"
                       id="phone"
                       th:field="*{phone}"/>
                <div class="invalid-feedback"
                     th:errors="*{phone}"></div>
            </div>

            <!-- Website -->
            <div class="col-sm-6">
                <label for="website" class="form-label">Website</label>
                <input type="text"
                       class="form-control"
                       id="website"
                       th:field="*{website}"/>
                <div class="invalid-feedback"
                     th:errors="*{website}"></div>
            </div>

            <!-- Address Line 1 -->
            <div class="col-sm-6">
                <label for="addressLine1" class="form-label">Address Line 1</label>
                <input type="text"
                       class="form-control"
                       id="addressLine1"
                       th:field="*{addressLine1}"/>
            </div>

            <!-- Address Line 2 -->
            <div class="col-sm-6">
                <label for="addressLine2" class="form-label">Address Line 2</label>
                <input type="text"
                       class="form-control"
                       id="addressLine2"
                       th:field="*{addressLine2}"/>
            </div>

            <!-- City -->
            <div class="col-sm-6">
                <label for="city" class="form-label">City</label>
                <input type="text"
                       class="form-control"
                       id="city"
                       th:field="*{city}"/>
            </div>

            <!-- State / Province -->
            <div class="col-sm-6">
                <label for="stateProvince" class="form-label">State / Province</label>
                <input type="text"
                       class="form-control"
                       id="stateProvince"
                       th:field="*{stateProvince}"/>
            </div>

            <!-- Postal Code -->
            <div class="col-sm-6">
                <label for="postalCode" class="form-label">Postal Code</label>
                <input type="text"
                       class="form-control"
                       id="postalCode"
                       th:field="*{postalCode}"/>
            </div>

            <!-- Country -->
            <div class="col-sm-6">
                <label for="country" class="form-label">Country</label>
                <input type="text"
                       class="form-control"
                       id="country"
                       th:field="*{country}"/>
            </div>

            <!-- Country Region -->
            <div class="col-sm-6">
                <label for="countryRegion" class="form-label">Country Region</label>
                <input type="text"
                       class="form-control"
                       id="countryRegion"
                       th:field="*{countryRegion}"/>
            </div>

            <!-- Industry -->
            <div class="col-sm-6">
                <label for="industry" class="form-label">Industry</label>
                <input type="text"
                       class="form-control"
                       id="industry"
                       th:field="*{industry}"/>
            </div>

            <!-- Billing Currency -->
            <div class="col-sm-6">
                <label for="billingCurrency" class="form-label">Billing Currency</label>
                <input type="text"
                       class="form-control"
                       id="billingCurrency"
                       th:field="*{billingCurrency}"/>
            </div>

        </div>

        <hr class="my-4"/>

        <button class="w-100 btn btn-primary btn-lg" type="submit">
            Save Client
        </button>

    </form>

</main>
</div>
</body>
</html>
