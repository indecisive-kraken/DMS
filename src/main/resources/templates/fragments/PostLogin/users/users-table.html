<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity" lang="en" data-bs-theme="auto">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<div class="table-responsive small" th:fragment="users-table-fragment">
    <table class="table table-striped table-sm">
        <thead>
        <tr>
            <th scope="col">CreatedAt</th>
            <th scope="col">UpdatedAt</th>
            <th scope="col">Username</th>
            <th scope="col">E-mail</th>
            <th scope="col">Role</th>
            <th scope="col">Edit<th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${usersPage.content}">
            <td th:text="${user.createdAt}"></td>
            <td th:text="${user.updatedAt}"></td>
            <td th:text="${user.username}"></td>
            <td th:text="${user.email}"></td>
            <td th:text="${user.role}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
